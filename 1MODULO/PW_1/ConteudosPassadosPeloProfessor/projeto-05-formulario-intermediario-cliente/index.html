<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres UTF-8 para suporte a acentuação -->
    <meta charset="UTF-8">
    <!-- Torna a página responsiva e adaptada para dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da página exibido na aba do navegador -->
    <title>Cadastro Intermediário de Clientes</title>
    <!-- Vincula a folha de estilos externa CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Contêiner principal estrutural da página -->
    <main class="container-formulario">
        
        <!-- Cabeçalho descritivo do formulário -->
        <header class="form-header">
            <h1>Cadastro de Novo Cliente</h1>
            <p>Preencha os campos abaixo com suas informações para realizar o registro no sistema.</p>
        </header>

        <!-- Elemento form utilizando validações nativas e método POST -->
        <form action="#" method="POST" class="form-cadastro">

            <!-- Grupo 1: Informações Pessoais -->
            <fieldset class="form-fieldset">
                <legend>1. Dados Pessoais</legend>

                <!-- Campo Nome Completo -->
                <div class="form-group">
                    <label for="nome">Nome Completo <span class="obrigatorio">*</span></label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Ana Souza Silva" minlength="3" required>
                </div>

                <!-- Linha dupla para E-mail e Telefone -->
                <div class="form-row">
                    <!-- Campo E-mail com validação nativa de formato -->
                    <div class="form-group">
                        <label for="email">E-mail <span class="obrigatorio">*</span></label>
                        <input type="email" id="email" name="email" placeholder="nome@exemplo.com" required>
                    </div>

                    <!-- Campo Telefone com validação de padrão (pattern) brasileiro -->
                    <div class="form-group">
                        <label for="telefone">Telefone / WhatsApp <span class="obrigatorio">*</span></label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(11) 98765-4321" pattern="\([0-9]{2}\)\s[0-9]{4,5}-[0-9]{4}" title="Formato esperado: (XX) 9XXXX-XXXX" required>
                    </div>
                </div>

                <!-- Linha dupla para Data de Nascimento e CPF -->
                <div class="form-row">
                    <!-- Campo Data -->
                    <div class="form-group">
                        <label for="nascimento">Data de Nascimento <span class="obrigatorio">*</span></label>
                        <input type="date" id="nascimento" name="nascimento" required>
                    </div>

                    <!-- Campo CPF com padrão numérico -->
                    <div class="form-group">
                        <label for="cpf">CPF <span class="obrigatorio">*</span></label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" title="Formato esperado: 000.000.000-00" required>
                    </div>
                </div>
            </fieldset>


            <!-- Grupo 2: Endereço -->
            <fieldset class="form-fieldset">
                <legend>2. Endereço Residencial</legend>

                <!-- Campo CEP com padrão de 8 dígitos -->
                <div class="form-row">
                    <div class="form-group half">
                        <label for="cep">CEP <span class="obrigatorio">*</span></label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000" pattern="[0-9]{5}-[0-9]{3}" title="Formato esperado: 00000-000" required>
                    </div>
                    <div class="form-group">
                        <!-- Espaçamento estrutural vazio para manter o alinhamento do grid -->
                    </div>
                </div>

                <!-- Campo Logradouro e Número -->
                <div class="form-row">
                    <div class="form-group flex-grow">
                        <label for="endereco">Endereço (Rua, Avenida, etc.) <span class="obrigatorio">*</span></label>
                        <input type="text" id="endereco" name="endereco" placeholder="Ex: Av. Brasil" required>
                    </div>

                    <div class="form-group numero-width">
                        <label for="numero">Número <span class="obrigatorio">*</span></label>
                        <input type="number" id="numero" name="numero" placeholder="1500" min="1" required>
                    </div>
                </div>

                <!-- Campo Cidade e Estado -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="cidade">Cidade <span class="obrigatorio">*</span></label>
                        <input type="text" id="cidade" name="cidade" placeholder="Ex: Praia Grande" required>
                    </div>

                    <div class="form-group">
                        <label for="estado">Estado (UF) <span class="obrigatorio">*</span></label>
                        <!-- Seleção suspensa (select) -->
                        <select id="estado" name="estado" required>
                            <option value="" disabled selected>Selecione o estado...</option>
                            <option value="SP">São Paulo (SP)</option>
                            <option value="RJ">Rio de Janeiro (RJ)</option>
                            <option value="MG">Minas Gerais (MG)</option>
                            <option value="RS">Rio Grande do Sul (RS)</option>
                            <option value="PR">Paraná (PR)</option>
                            <option value="OUTROS">Outros</option>
                        </select>
                    </div>
                </div>
            </fieldset>


            <!-- Grupo 3: Preferências e Observações -->
            <fieldset class="form-fieldset">
                <legend>3. Informações Complementares</legend>

                <!-- Grupo de Rádio (Seleção Única) -->
                <div class="form-group">
                    <label>Como conheceu nossa empresa? <span class="obrigatorio">*</span></label>
                    <div class="radio-container">
                        <label class="radio-label">
                            <input type="radio" name="origem" value="redes-sociais" required> Redes Sociais
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="origem" value="indicacao"> Indicação de Amigo
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="origem" value="busca"> Mecanismos de Busca (Google)
                        </label>
                    </div>
                </div>

                <!-- Campo Textarea (Área de Texto Multilinha) -->
                <div class="form-group">
                    <label for="observacoes">Observações ou Comentários</label>
                    <textarea id="observacoes" name="observacoes" rows="4" placeholder="Escreva informações adicionais, restrições ou dúvidas..."></textarea>
                </div>

                <!-- Caixa de Seleção (Checkbox) obrigatória -->
                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="termos" required> Concordo com os termos de uso e política de privacidade <span class="obrigatorio">*</span>
                    </label>
                </div>
            </fieldset>


            <!-- Botões de Ação do Formulário -->
            <div class="form-actions">
                <!-- Botão de limpar campos -->
                <button type="reset" class="btn-secondary">Limpar Dados</button>
                <!-- Botão de envio disparando as validações nativas do HTML -->
                <button type="submit" class="btn-primary">Enviar Cadastro</button>
            </div>

        </form>
    </main>

</body>
</html>
